name: "postgres"
version: "1.0.0"
description: "部署 PostgreSQL 关系型数据库 (支持数据持久化与版本选择)"
category: "service"
platforms: ["linux", "darwin", "windows"]
author: "dpilot"

inputs:
  - id: "container_name"
    type: "text"
    prompt: "容器名称是什么？"
    default: "my-postgres"
    required: true

  - id: "port"
    type: "number"
    prompt: "映射的主机端口"
    default: 5432
    required: true

  - id: "db_name"
    type: "text"
    prompt: "初始数据库名称"
    default: "app_db"
    required: true

  - id: "db_user"
    type: "text"
    prompt: "超级用户名"
    default: "postgres"
    required: true

  - id: "db_password"
    type: "password"
    prompt: "超级用户密码"
    required: true

  - id: "enable_volume"
    type: "confirm"
    prompt: "是否使用 Docker 数据卷持久化存储？"
    default: true

  - id: "version_tag"
    type: "select"
    prompt: "选择 PostgreSQL 版本"
    options: ["17-alpine", "16-alpine", "15-alpine"]
    default: "16-alpine"

steps:
  - name: "拉取 PostgreSQL 镜像"
    command: "docker pull postgres:{{ version_tag }}"
    show_output: false

  - name: "清理同名旧容器 (若存在)"
    command: "docker rm -f {{ container_name }} 2>/dev/null || true"
    allow_failure: true

  - name: "启动 PostgreSQL 容器"
    command: >
      docker run -d
      --name {{ container_name }}
      -p {{ port }}:5432
      -e POSTGRES_DB={{ db_name }}
      -e POSTGRES_USER={{ db_user }}
      -e POSTGRES_PASSWORD={{ db_password }}
      {% if enable_volume %}-v {{ container_name }}_data:/var/lib/postgresql/data{% endif %}
      --restart unless-stopped
      postgres:{{ version_tag }}

  - name: "检查容器运行状态"
    command: "docker ps --filter name={{ container_name }} --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
    show_output: true
