name: "install-docker"
version: "1.0.0"
description: "在 Linux (Ubuntu/Debian/CentOS/RHEL) 上一键安装 Docker Engine 与 Docker Compose"
category: "system"
platforms: ["linux"]
author: "dpilot"

inputs:
  - id: "install_compose"
    type: "confirm"
    prompt: "是否安装 Docker Compose 插件？"
    default: true

  - id: "add_current_user"
    type: "confirm"
    prompt: "是否将当前用户添加到 docker 用户组（免 sudo 执行 docker 命令）？"
    default: true

  - id: "mirror_source"
    type: "select"
    prompt: "请选择 Docker 安装源 / 镜像加速源"
    options: ["官方源 (get.docker.com)", "阿里云镜像源 (中国大陆加速)"]
    default: "官方源 (get.docker.com)"

steps:
  - name: "检查 Root 或 Sudo 权限"
    command: |
      if [ "$(id -u)" -ne 0 ] && ! command -v sudo >/dev/null 2>&1; then
        echo "错误: 安装 Docker 需要 root 或 sudo 权限。" >&2
        exit 1
      fi
    show_output: false

  - name: "下载并执行 Docker 官方安装脚本"
    command: |
      SUDO=""
      if [ "$(id -u)" -ne 0 ]; then
        SUDO="sudo"
      fi
      {% if mirror_source == "阿里云镜像源 (中国大陆加速)" %}
      curl -fsSL https://get.docker.com | $SUDO bash -s docker --mirror Aliyun
      {% else %}
      curl -fsSL https://get.docker.com | $SUDO sh
      {% endif %}
    show_output: true

  - name: "启用并启动 Docker 系统服务"
    command: |
      SUDO=""
      if [ "$(id -u)" -ne 0 ]; then
        SUDO="sudo"
      fi
      if command -v systemctl >/dev/null 2>&1; then
        $SUDO systemctl enable --now docker
      elif command -v service >/dev/null 2>&1; then
        $SUDO service docker start
      fi
    show_output: false

  - name: "配置用户权限组"
    command: |
      {% if add_current_user %}
      SUDO=""
      if [ "$(id -u)" -ne 0 ]; then
        SUDO="sudo"
      fi
      CURRENT_USER="${SUDO_USER:-$USER}"
      if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then
        $SUDO usermod -aG docker "$CURRENT_USER" || true
        echo "用户 $CURRENT_USER 已加入 docker 用户组。提示：可能需要重新登录终端使权限生效。"
      fi
      {% else %}
      echo "跳过用户组配置。"
      {% endif %}
    show_output: true

  - name: "验证 Docker 与 Compose 安装状态"
    command: "docker --version && docker compose version"
    show_output: true
