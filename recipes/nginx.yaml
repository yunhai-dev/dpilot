name: "nginx"
version: "1.0.0"
description: "高性能 Nginx Web 服务器与反向代理容器"
category: "service"
platforms: ["linux", "darwin", "windows"]
author: "dpilot"

inputs:
  - id: "container_name"
    type: "text"
    prompt: "容器名称是什么？"
    default: "my-nginx"
    required: true

  - id: "http_port"
    type: "number"
    prompt: "映射的主机 HTTP 端口"
    default: 80
    required: true

  - id: "enable_https"
    type: "confirm"
    prompt: "是否启用 HTTPS 端口 (443) 映射？"
    default: false

  - id: "https_port"
    type: "number"
    prompt: "映射的主机 HTTPS 端口"
    default: 443
    required: false

  - id: "version_tag"
    type: "select"
    prompt: "选择 Nginx 版本镜像标签"
    options: ["alpine", "latest", "mainline-alpine"]
    default: "alpine"

steps:
  - name: "拉取 Nginx 镜像"
    command: "docker pull nginx:{{ version_tag }}"
    show_output: false

  - name: "清理同名旧容器 (若存在)"
    command: "docker rm -f {{ container_name }} 2>/dev/null || true"
    allow_failure: true

  - name: "启动 Nginx 容器"
    command: >
      docker run -d
      --name {{ container_name }}
      -p {{ http_port }}:80
      {% if enable_https %}-p {{ https_port }}:443{% endif %}
      --restart unless-stopped
      nginx:{{ version_tag }}

  - name: "检查容器运行状态"
    command: "docker ps --filter name={{ container_name }} --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
    show_output: true
